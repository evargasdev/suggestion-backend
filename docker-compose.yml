services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4000:3000'
    volumes:
      - .:/usr/app
      - /usr/app/node_modules
    environment:
      NODE_ENV: development
      CI: true
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      DATABASE_URL: ${DATABASE_URL:-}
      # PG_HOST: postgres_db
      # PG_PORT: ${PG_PORT:-5432}
      # PG_USERNAME: ${PG_USERNAME:-suggestion}
      # PG_PASSWORD: ${PG_PASSWORD:-suggestion}
      # PG_DATABASE: ${PG_DATABASE:-suggestion}
    # depends_on:
    #   - postgres_db
    command: pnpm run start:dev

