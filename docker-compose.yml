services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.pro
      target: production
    container_name: suggestion-api
    restart: unless-stopped
    ports:
      - '${API_PORT:-4000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es requerida en producción}
      # Si usas variables separadas en lugar de DATABASE_URL, descomenta estas:
      # PG_HOST: postgres_db
      # PG_PORT: 5432
      # PG_USERNAME: ${PG_USERNAME:?PG_USERNAME es requerido}
      # PG_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD es requerido}
      # PG_DATABASE: ${PG_DATABASE:-suggestion}
    # Descomenta si levantas PostgreSQL dentro del mismo Compose en lugar de usar una BD administrada (RDS/Supabase/Neon):
    # depends_on:
    #   postgres_db:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Opcional: Descomentar solo si alojas PostgreSQL en el mismo servidor Docker
